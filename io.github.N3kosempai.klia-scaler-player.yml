app-id: io.github.N3kosempai.klia-scaler-player
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: klia-scaler-player
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: klia-scaler-player
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/klia-scaler-player /app/bin/klia-scaler-player
      - cp -a lib/. /app/lib/
      - cp -a share/. /app/share/
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-scaler-player/releases/download/v1.6.0/klia-scaler-player-1.6.0-x86_64.tar.gz
        sha256: 114cd7de8582b936b173b9beaca4e15e007cda1e4e2a658d588f8252921e4f4e
        strip-components: 0
