app-id: io.github.N3kosempai.klia-scaler-player
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: klia-scaler-player
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: klia-scaler-player
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/klia-scaler-player /app/bin/klia-scaler-player
      - cp -a lib/. /app/lib/
      - cp -a share/. /app/share/
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-scaler-player/releases/download/v1.5.1/klia-scaler-player-1.5.1-x86_64.tar.gz
        sha256: af6916e48506f49857d1193327f526085e074925f0dda62805c9fb7afb71f60a
        strip-components: 0
