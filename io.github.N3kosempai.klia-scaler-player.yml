app-id: io.github.N3kosempai.klia-scaler-player
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: klia-scaler-player
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
modules:
  - name: klia-scaler-player
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/klia-scaler-player /app/bin/klia-scaler-player
      - cp -a lib/. /app/lib/
      - cp -a share/. /app/share/
    sources:
      - type: archive
        url: https://github.com/N3koSempai/klia-scaler-player/releases/download/v1.4.0/klia-scaler-player-1.4.0-x86_64.tar.gz
        sha256: 73ee16230ce1a34ab2104e141871866a6bd54623fb4f575ca7ba50437ff5d0d0
        strip-components: 0
